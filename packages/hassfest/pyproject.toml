[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hassfest"
dynamic = ["version", "requires-python"]
dependencies = ["ruff"]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
description = "Validate Universal Universal Home Assistant integrations."
readme = "README.md"
authors = [
  { name = "The Universal Universal Home Assistant Authors", email = "hello@universalassistant.io" },
]

[project.urls]
Repository = "https://github.com/yashhasan570/UniversalUniversalAssistant"
Documentation = "https://contributors.universalassistant.io"

[tool.setuptools.packages.find]
include = ["hassfest*"]

[tool.setuptools.package-data]
hassfest = ["_data/build.json"]

[tool.pytest.ini_options]
addopts = "-p no:respx -p no:pytest_universalassistant"
pythonpath = ["."]
testpaths = ["tests"]
