# Defines a list of files that are part of main core of Universal Home Assistant.
# Changes to these files/filters define how our CI test suite is ran.
core: &core
  - universalassistant/*.py
  - universalassistant/auth/**
  - universalassistant/helpers/**
  - universalassistant/package_constraints.txt
  - universalassistant/util/**
  - mypy.ini
  - pyproject.toml
  - requirements.txt
  - setup.cfg

# Performance benchmark suite (CodSpeed). Only gates the benchmark job; kept out
# of the `any` aggregate below so it does not pull in the full test suite.
benchmarks: &benchmarks
  - benchmarks/**
  - requirements_test.txt

